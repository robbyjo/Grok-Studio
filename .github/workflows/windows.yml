name: Windows portable

on:
  push:
    branches: [main]
    paths-ignore: [README.md, TODO.md, 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    outputs:
      portable-artifact-id: ${{ steps.portable.outputs.artifact-id }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      XAI_API_KEY: ''
      GROK_DEPLOYMENT_KEY: ''
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          icacls node_modules/electron/dist /grant '*S-1-15-2-1:(OI)(CI)(RX)' /T /Q
      - name: Verify pinned Grok runtime
        run: npm run runtime
      - name: Build pinned embedded engine
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default 1.95.0
          npm run engine:build
      - name: Formatting
        run: npm run format:check
      - name: Build and typecheck
        run: npm run build
      - name: Backend and native MCP acceptance
        run: npm test
      - name: Native desktop acceptance
        run: npm run test:ui
      - name: Build portable executable
        run: npm run package:portable
      - name: Packaged desktop acceptance
        run: |
          icacls release/win-unpacked /grant '*S-1-15-2-1:(OI)(CI)(RX)' /T /Q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:GROK_DESKTOP_TEST_EXE = Join-Path $PWD 'release/win-unpacked/Grok Workbench.exe'
          npm run test:ui
      - name: Actual portable launch and relocation
        run: npm run test:portable
      - name: Actual portable replacement, restart and rollback
        run: |
          # Same source/version, different compression: a private reviewed-download fixture.
          # The release/manifest/download gates are covered separately by backend tests.
          npx electron-builder --prepackaged release/win-unpacked --win portable --x64 --config.compression=store --config.directories.output=.test-data/update-twin --config.portable.artifactName=Workbench-Unreleased-Twin.exe --publish never
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $taskPortable = Get-ChildItem -LiteralPath release -Filter 'Grok-Workbench-*-Portable.exe' | Select-Object -First 1
          npx tsx scripts/portable-update-acceptance.ts --run --current .test-data/update-twin/Workbench-Unreleased-Twin.exe --replacement $taskPortable.FullName
      - name: Record executable hash
        run: |
          Get-ChildItem -LiteralPath release -Filter 'Grok-Workbench-*-Portable.exe' | ForEach-Object {
            $taskHash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath ($_.FullName + '.sha256') -Value ($taskHash + '  ' + $_.Name) -Encoding ascii
          }
      - name: Upload tested portable
        id: portable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Grok-Workbench-Windows-x64-${{ github.sha }}
          path: |
            release/Grok-Workbench-*-Portable.exe
            release/Grok-Workbench-*-Portable.exe.sha256
            release/Grok-Workbench-*-Portable.exe.manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload test screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Windows-validation-${{ github.sha }}
          path: |
            .test-data/*.png
            .test-data/portable-replacement-*/result.json
            test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  sign:
    needs: windows
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SIGNPATH_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    environment: code-signing
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Check approved signing configuration
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_SLUG: ${{ vars.SIGNPATH_ARTIFACT_SLUG }}
          GROK_SIGNER_THUMBPRINT: ${{ vars.GROK_SIGNER_THUMBPRINT }}
          GROK_SIGNER_NAME: ${{ vars.GROK_SIGNER_NAME }}
        run: |
          foreach ($taskName in @('SIGNPATH_ORGANIZATION_ID','SIGNPATH_PROJECT_SLUG','SIGNPATH_POLICY_SLUG','SIGNPATH_ARTIFACT_SLUG','GROK_SIGNER_THUMBPRINT','GROK_SIGNER_NAME')) {
            if (-not [Environment]::GetEnvironmentVariable($taskName)) { throw "Missing approved signing configuration: $taskName" }
          }
      - name: Submit CI-origin artifact for human-approved signing
        uses: signpath/github-action-submit-signing-request@4184a38a17e5b37d026a3ed443581c1f03ae1b3a
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_SLUG }}
          github-artifact-id: ${{ needs.windows.outputs.portable-artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Install locked acceptance dependencies
        run: npm ci
      - name: Verify signer and regenerate signed metadata
        env:
          GROK_SIGNER_THUMBPRINT: ${{ vars.GROK_SIGNER_THUMBPRINT }}
          GROK_SIGNER_NAME: ${{ vars.GROK_SIGNER_NAME }}
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $taskExe = @(Get-ChildItem -LiteralPath signed -Filter 'Grok-Workbench-*-Portable.exe')
          if ($taskExe.Count -ne 1) { throw 'Expected exactly one signed portable.' }
          $env:GROK_ORIGINAL_MANIFEST = $taskExe[0].FullName + '.manifest.json'
          Copy-Item -LiteralPath $taskExe[0].FullName -Destination release
          node scripts/update-manifest.cjs --require-signing
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path .runtime -Force | Out-Null
          $taskOriginal = Get-Content -LiteralPath $env:GROK_ORIGINAL_MANIFEST -Raw | ConvertFrom-Json
          @{sha256=$taskOriginal.engineSha256;revision=$taskOriginal.nativeRevision;bindingVersion=$taskOriginal.bindingVersion} | ConvertTo-Json | Set-Content -LiteralPath .runtime/engine.json
      - name: Accept signed portable launch and relocation
        run: npm run test:portable
      - name: Upload verified signed portable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Grok-Workbench-Signed-Windows-x64-${{ github.sha }}
          path: |
            release/Grok-Workbench-*-Portable.exe
            release/Grok-Workbench-*-Portable.exe.sha256
            release/Grok-Workbench-*-Portable.exe.manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
