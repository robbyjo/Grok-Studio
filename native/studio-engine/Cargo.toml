[package]
name = "grok-studio-engine"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "2.16"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
xai-grok-shell = { path = "../../upstream/grok-build/crates/codegen/xai-grok-shell" }
xai-grok-tools = { path = "../../upstream/grok-build/crates/codegen/xai-grok-tools" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"

[patch.crates-io]
async-openai = { git = "https://github.com/our-forks/async-openai.git", rev = "95b52ebdedf42143083cf3d6f0e0be7c84e9c808" }

[profile.release]
opt-level = 2
debug = false
lto = false
codegen-units = 16

[workspace]
